spring:
  datasource:
    url: jdbc:mysql://localhost:3306/condor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: condor
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: transactions-engine-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: com.condor.transactionsengine.integration.ProtobufDeserializer
      properties:
        protobuf.type: com.condor.event.TransactionInitiatedEventProto$TransactionInitiatedEvent

server:
  port: 3000

webhook:
  url: https://postman-echo.com/post
