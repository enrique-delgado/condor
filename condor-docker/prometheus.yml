global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot microservices (ejemplo: customers-manager, transactions-manager)
  - job_name: 'condor-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'condor-customers-manager:8080'
          - 'condor-transactions-manager:8080'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Kafka (via JMX exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
