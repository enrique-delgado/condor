spring:
  datasource:
    url: jdbc:h2:mem:condor_transactions;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.springframework: WARN
    com.condor.customersmanager: DEBUG

# Actuator para health checks en pruebas
management:
  endpoints:
    web:
      exposure:
        include: health,info
