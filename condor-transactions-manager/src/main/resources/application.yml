spring:
  application:
    name: condor-transactions-manager

  datasource:
    url: jdbc:mysql://localhost:3306/condor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: condor
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.condor.transactionsmanager.integration.ProtobufSerializer

  jackson:
    default-property-inclusion: non_null

server:
  port: 2000

# Configuración común
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

flyway:
  enabled: true
  locations: classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: WARN
    org.springframework: ERROR
    com.condor.transactionsmanager: INFO
